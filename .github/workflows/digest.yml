name: Weekly portfolio digest

on:
  schedule:
    # Mondays at 07:00 UTC. GitHub delays scheduled runs under load, so treat
    # this as "some time Monday morning" rather than an exact hour.
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Post digest
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 digest.py
